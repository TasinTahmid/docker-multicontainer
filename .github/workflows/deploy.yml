name: Build, Push, and Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-north-1
  ECS_CLUSTER: docker-multicontainer-cluster

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Set up Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # - name: Log in to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build and push API
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./server
      #     file: ./server/Dockerfile
      #     push: true
      #     tags: mdtahmid/api:latest

      # - name: Build and push Client
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./client
      #     file: ./client/Dockerfile
      #     push: true
      #     tags: mdtahmid/client:latest

      # - name: Build and push Worker
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./worker
      #     file: ./worker/Dockerfile
      #     push: true
      #     tags: mdtahmid/worker:latest

      # - name: Build and push Nginx
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ./nginx
      #     file: ./nginx/Dockerfile
      #     push: true
      #     tags: mdtahmid/nginx:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::584503397704:role/GitHubActionsDeployRole
          aws-region: eu-north-1

      - name: Force new ECS deployments
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service api \
            --force-new-deployment

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service docker-client-service-5xegozw7 \
            --force-new-deployment

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service docker-worker-service-pj7cjh35 \
            --force-new-deployment

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service nginx \
            --force-new-deployment

      - name: Wait for ECS services to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services api \
                      docker-client-service-5xegozw7 \
                      docker-worker-service-pj7cjh35 \
                      nginx
